name: Update Algolia DocSearch index

on:
  workflow_run:
    workflows: ["Sync gh-pages to OSS"]
    types:
      - completed
  workflow_dispatch:

jobs:
  algolia-index:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Wait for live site
        run: |
          set -e
          url="https://developer.d-robotics.cc/case_doc/case"
          echo "Waiting for published site: $url"
          for i in $(seq 1 18); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -A "case-doc-algolia-indexer/1.0" "$url" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Live site was not reachable with HTTP 200; indexing the currently published pages anyway."

      - name: Crawl live site and update Algolia index
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
          ALGOLIA_SITE_URL: ${{ vars.ALGOLIA_SITE_URL }}
        run: |
          if [ -z "$ALGOLIA_ADMIN_API_KEY" ]; then
            echo "Missing repository secret ALGOLIA_ADMIN_API_KEY (Admin or Write API Key)."
            exit 1
          fi
          npm run algolia:index

      - name: Setup ossutil v2
        run: |
          if [ ! -x "$HOME/ossutil" ]; then
            curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
            unzip ossutil.zip
            cd ossutil-2.1.2-linux-amd64
            chmod 755 ossutil
            mv ossutil "$HOME/ossutil"
          fi

      # 覆盖式单文件上传：覆盖 OSS 上残留的旧 search-index.json（8 月过期产物）。
      # 不能带 -r / --update（那只会增不删），必须覆盖根下同名文件。
      - name: Upload easyops search-index.json to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ~/ossutil cp scripts/_algolia_tmp/search-index.json \
            oss://cn-rdk-front-prod/case_doc/search-index.json \
            -e https://d-robotics.cc \
            -i $OSS_ACCESS_KEY_ID \
            -k $OSS_ACCESS_KEY_SECRET \
            --region cn-beijing \
            --retry-times=3
